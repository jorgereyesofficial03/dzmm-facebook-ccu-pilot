name: Facebook CCU Multi-Channel

on:
  workflow_dispatch:
    inputs:
      station_key:
        description: "Facebook station"
        required: true
        default: "dzmm"
        type: choice
        options:
          - dzmm
          - dzbb
          - dzrh
          - dwww
          - dwxi
          - dzrv
      mode:
        description: "Run mode"
        required: true
        default: "manual_test"
        type: choice
        options:
          - manual_test
          - scheduled_window
      slot_hour:
        description: "Scheduled PHT hour, 5 through 12"
        required: true
        default: "7"
        type: string
      retry_end_minute:
        description: "Scheduled mode only: stop retrying after this minute"
        required: true
        default: "15"
        type: string

permissions:
  contents: read

concurrency:
  group: facebook-ccu-${{ github.event.inputs.station_key }}-${{ github.event.inputs.mode }}-${{ github.event.inputs.slot_hour }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Manila
      STATION_KEY: ${{ github.event.inputs.station_key }}
      RUN_MODE: ${{ github.event.inputs.mode }}
      SLOT_HOUR: ${{ github.event.inputs.slot_hour }}
      RETRY_END_MINUTE: ${{ github.event.inputs.retry_end_minute }}
      APPS_SCRIPT_CALLBACK_URL: ${{ secrets.APPS_SCRIPT_CALLBACK_URL }}
      APPS_SCRIPT_CALLBACK_SECRET: ${{ secrets.APPS_SCRIPT_CALLBACK_SECRET }}

    steps:
      - name: Validate callback configuration
        shell: bash
        run: |
          if [ -z "$APPS_SCRIPT_CALLBACK_URL" ]; then
            echo "::error::Missing APPS_SCRIPT_CALLBACK_URL repository secret."
            exit 1
          fi
          if [ -z "$APPS_SCRIPT_CALLBACK_SECRET" ]; then
            echo "::error::Missing APPS_SCRIPT_CALLBACK_SECRET repository secret."
            exit 1
          fi
          echo "Apps Script callback secrets are configured."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Facebook CCU probe
        run: npm run probe

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-ccu-${{ github.event.inputs.station_key }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
