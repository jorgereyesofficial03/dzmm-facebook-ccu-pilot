name: Facebook CCU Multi-Channel

on:
  workflow_dispatch:
    inputs:
      station_key:
        description: "Facebook station"
        required: true
        default: "dzmm"
        type: choice
        options:
          - dzmm
          - dzbb
          - dzrh
          - dwww
          - dwxi
          - dzrv
      mode:
        description: "Run mode"
        required: true
        default: "manual_test"
        type: choice
        options:
          - manual_test
          - scheduled_window
      slot_key:
        description: "Program start key, e.g. 0730"
        required: true
        default: "1600"
        type: string
      slot_label:
        description: "Program start label, e.g. 4:00 PM"
        required: true
        default: "4:00 PM"
        type: string
      slot_date:
        description: "PHT scheduled date YYYY-MM-DD"
        required: true
        default: "2026-09-30"
        type: string
      window_end_minute_of_day:
        description: "PHT minute-of-day when retry window ends"
        required: true
        default: "980"
        type: string

permissions:
  contents: read

concurrency:
  group: facebook-ccu-${{ github.event.inputs.station_key }}-${{ github.event.inputs.mode }}-${{ github.event.inputs.slot_date }}-${{ github.event.inputs.slot_key }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Manila
      STATION_KEY: ${{ github.event.inputs.station_key }}
      RUN_MODE: ${{ github.event.inputs.mode }}
      SLOT_KEY: ${{ github.event.inputs.slot_key }}
      SLOT_LABEL: ${{ github.event.inputs.slot_label }}
      SLOT_DATE: ${{ github.event.inputs.slot_date }}
      WINDOW_END_MINUTE_OF_DAY: ${{ github.event.inputs.window_end_minute_of_day }}
      APPS_SCRIPT_CALLBACK_URL: ${{ secrets.APPS_SCRIPT_CALLBACK_URL }}
      APPS_SCRIPT_CALLBACK_SECRET: ${{ secrets.APPS_SCRIPT_CALLBACK_SECRET }}

    steps:
      - name: Validate callback configuration
        shell: bash
        run: |
          if [ -z "$APPS_SCRIPT_CALLBACK_URL" ]; then
            echo "::error::Missing APPS_SCRIPT_CALLBACK_URL repository secret."
            exit 1
          fi
          if [ -z "$APPS_SCRIPT_CALLBACK_SECRET" ]; then
            echo "::error::Missing APPS_SCRIPT_CALLBACK_SECRET repository secret."
            exit 1
          fi
          echo "Apps Script callback secrets are configured."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Facebook CCU probe
        run: npm run probe

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-ccu-${{ github.event.inputs.station_key }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
